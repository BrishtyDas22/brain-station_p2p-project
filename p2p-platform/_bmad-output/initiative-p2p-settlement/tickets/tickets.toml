# Initiative breakdown — P2P Settlement
#
# The epics in build order. Each is written thin (`refined: false`); Sofia cuts the
# initiative's R1-R30 into per-epic Requirements and then plans the epic's stories.
#
# `covers` cites the initiative's requirement ids. `prerequisites` lists the epics that
# must exist first, because each depends on a contract its predecessor fixes.

